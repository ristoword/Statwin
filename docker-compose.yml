services:
  postgres:
    image: postgres:16-alpine
    container_name: statwin-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-statwin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-statwin_secret}
      POSTGRES_DB: ${DB_NAME:-statwin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-statwin} -d ${DB_NAME:-statwin}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - statwin

  redis:
    image: redis:7-alpine
    container_name: statwin-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - statwin

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: statwin-api
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://statwin:statwin_secret@postgres:5432/statwin?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      FRONTEND_URL: http://localhost:3000
      ADMIN_URL: http://localhost:3002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - statwin

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: statwin-web
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    networks:
      - statwin

networks:
  statwin:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
